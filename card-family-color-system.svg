    <text x="96" y="105" font-family="Arial" font-size="13" fill="#667278">Builds support</text>
    <text x="25" y="154" font-family="Arial" font-size="12" font-weight="700" fill="#9A6816">OCHRE · HANDSHAKE</text>
    <text x="25" y="176" font-family="Arial" font-size="12" fill="#667278">Member, caucus, ally</text>
