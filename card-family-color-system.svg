    <text x="96" y="105" font-family="Arial" font-size="13" fill="#667278">Constructs the bill</text>
    <text x="25" y="154" font-family="Arial" font-size="12" font-weight="700" fill="#B6503A">CORAL · DOCUMENT</text>
    <text x="25" y="176" font-family="Arial" font-size="12" fill="#667278">Provision, amendment, rule</text>
