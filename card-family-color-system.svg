    <text x="96" y="105" font-family="Arial" font-size="13" fill="#667278">Supports or challenges</text>
    <text x="25" y="154" font-family="Arial" font-size="12" font-weight="700" fill="#267783">TEAL · CHART</text>
    <text x="25" y="176" font-family="Arial" font-size="12" fill="#667278">Data, testimony, estimate</text>
  </g>
