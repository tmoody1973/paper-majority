  <circle cx="1104" cy="656" r="13" fill="#9b3d32"/><text x="1104" y="661" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="white">R</text>
  <text x="1088" y="691" text-anchor="middle" font-family="Arial" font-size="10" fill="#667278">Party: small badge only</text>

  <text x="600" y="746" text-anchor="middle" font-family="Arial" font-size="14" fill="#4f5e66">Party colors never define card families, facts, constituencies, or policy positions.</text>
