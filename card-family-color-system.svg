    <circle cx="52" cy="85" r="31" fill="#254F78"/><path d="M29 72 L52 59 L75 72 Z M34 78 H70 M37 78 V102 M47 78 V102 M57 78 V102 M67 78 V102 M31 106 H73" fill="none" stroke="white" stroke-width="5"/>
