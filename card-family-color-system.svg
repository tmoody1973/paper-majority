<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770">
  <rect width="1200" height="770" fill="#f2eee6"/>
  <text x="55" y="58" font-family="Arial" font-size="30" font-weight="700" fill="#182c38">Card Families: Color + Icon + Label</text>
  <text x="55" y="89" font-family="Arial" font-size="16" fill="#5b666d">Color accelerates recognition, but it never carries meaning alone.</text>

  <!-- Family tiles row 1 -->
  <g transform="translate(55 135)">
