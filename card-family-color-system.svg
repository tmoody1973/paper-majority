  </g>
  <g transform="translate(705 628)">
    <rect width="305" height="78" rx="15" fill="#f5e8c9"/>
    <path d="M34 18 L51 28 L51 48 L34 58 L17 48 L17 28 Z" fill="#9A6816"/><text x="34" y="44" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="white">✦</text>
