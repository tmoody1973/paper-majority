    <text x="96" y="105" font-family="Arial" font-size="13" fill="#667278">Controls procedure</text>
    <text x="25" y="154" font-family="Arial" font-size="12" font-weight="700" fill="#254F78">NAVY · BUILDING</text>
    <text x="25" y="176" font-family="Arial" font-size="12" fill="#667278">Committee, chamber, calendar</text>
