    <text x="96" y="105" font-family="Arial" font-size="13" fill="#667278">Changes risk and momentum</text>
    <text x="25" y="154" font-family="Arial" font-size="12" font-weight="700" fill="#844263">PLUM · MEGAPHONE</text>
    <text x="25" y="176" font-family="Arial" font-size="12" fill="#667278">Media, controversy, capital</text>
