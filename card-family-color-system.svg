  <g transform="translate(615 360)">
    <rect width="250" height="195" rx="18" fill="#fffaf2" stroke="#c8c0b0" stroke-width="2"/>
    <rect width="250" height="20" rx="8" fill="#844263"/>
    <circle cx="52" cy="85" r="31" fill="#844263"/><path d="M29 76 L59 67 V99 L29 90 Z M59 74 L72 78 V88 L59 93 Z M34 91 L39 107 H49 L45 93" fill="white"/>
