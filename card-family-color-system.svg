    <rect width="250" height="195" rx="18" fill="#fffaf2" stroke="#c8c0b0" stroke-width="2"/>
    <rect width="250" height="20" rx="8" fill="#9A6816"/>
    <circle cx="52" cy="85" r="31" fill="#9A6816"/><path d="M27 83 L42 70 L52 78 L62 70 L77 83 L64 103 L52 96 L40 103 Z" fill="white"/>
