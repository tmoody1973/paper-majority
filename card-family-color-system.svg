    <text x="96" y="105" font-family="Arial" font-size="13" fill="#667278">Unlocks combinations</text>
    <text x="25" y="154" font-family="Arial" font-size="12" font-weight="700" fill="#58636B">SLATE · PUZZLE</text>
    <text x="25" y="176" font-family="Arial" font-size="12" fill="#667278">Reusable legislative method</text>
  </g>

  <!-- information classes -->
  <text x="55" y="606" font-family="Arial" font-size="14" font-weight="700" letter-spacing="1" fill="#35444c">INFORMATION CLASS IS A SEPARATE SYSTEM</text>
  <g transform="translate(55 628)">
